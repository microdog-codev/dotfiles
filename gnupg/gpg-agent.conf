# https://github.com/drduh/config/blob/master/gpg-agent.conf
# https://www.gnupg.org/documentation/manuals/gnupg/Agent-Options.html
enable-ssh-support
no-allow-external-cache

# OpenPGP passphrases: one-minute sliding cache, two-minute maximum.
default-cache-ttl 60
max-cache-ttl 120

# SSH passphrases: one-hour sliding cache, eight-hour maximum.
default-cache-ttl-ssh 3600
max-cache-ttl-ssh 28800

# Use GnuPG's platform default. For the optional macOS GUI, uncomment the
# path matching the Homebrew prefix after installing pinentry-mac.
# pinentry-program /opt/homebrew/bin/pinentry-mac
# pinentry-program /usr/local/bin/pinentry-mac
