# Use backtick (`) as prefix key
unbind C-b
set-option -g prefix `
bind ` send-prefix

# Create the new window in the current pane’s working directory.
bind-key c   new-window   -c    "#{pane_current_path}"
bind-key '"' split-window -c    "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"

# Move around panes with ALT + arrow keys
#bind-key -T prefix k select-pane -U
#bind-key -T prefix h select-pane -L
#bind-key -T prefix j select-pane -D
#bind-key -T prefix l select-pane -R

# Enable 24-bit color support
#set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Send xterm compatible control arrow keys so they work with Vim
setw -g xterm-keys on

# Scrollback buffer
set -g history-limit 200000

# Allow passthrough
set-option -gq allow-passthrough on

# Toggle mouse with M
bind-key m set-option -g mouse on \; display 'Mouse: ON'
bind-key M set-option -g mouse off \; display 'Mouse: OFF'

# Rename window title
setw -g automatic-rename on
setw -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}(#{b:pane_current_path})#{?pane_dead,[dead],}"
setw -g allow-rename on

# Use vi keys in buffer
setw -g mode-keys vi

# Enable OSC 52 sequence of clipboard
set -g set-clipboard on

# Renumber windows on changed
set-option -g renumber-windows on

# Start windows and panes index at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Remove delay when switching between Vim modes
set -sg escape-time 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'microdog/tmux-mem-cpu-load#network'

# Include local config
source-file -q ~/.tmux.local.conf

set -g status-interval 2
set -g status-right '#[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --powerline-right --interval 2 --cpu-mode 1 --averages-count 0 --graph-lines 6 --network-mode 4)#[default]'
set -g status-right-length 60

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
