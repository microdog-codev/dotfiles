"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[╭─](fg:244) \
$all\
$fill\
$username\
$hostname\
$time\
$line_break\
[╰─](fg:244)\
$jobs\
$battery\
$status\
$os\
$container\
$shell\
$character"""

[fill]
symbol = " "

[localip]
disabled = true

[cmd_duration]
show_milliseconds = true

[username]
format = '[$user@]($style)'
style_user = "fg:180"
show_always = true

[time]
disabled = false
format = '[$time]($style) '
style = 'blue'

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "
ignore_base = false

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
truncate_to_repo = false
truncation_symbol = "…/"
truncation_length = 6

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_commit]
tag_symbol = '  '
tag_disabled = false

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = ""
format = '[$ssh_symbol$hostname]($style) '
style = "fg:180"
ssh_only = false

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[kubernetes]
disabled = false

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
